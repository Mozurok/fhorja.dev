<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 604" width="760" height="604" role="img" aria-label="Where a run stops: attended with a configured remote it runs to a pushed branch and a draft PR; with no remote, or in assisted mode, it ends at the local commit and waits on open decisions; marking ready and merging stay yours">
<title>Where a run stops</title>
<style>
@font-face{font-family:fhmono;font-weight:500;src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:fhsans;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:fhsans;font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}
.m500{font-family:fhmono,ui-monospace,Menlo,Consolas,monospace;font-weight:500}
.s400{font-family:fhsans,ui-sans-serif,system-ui,sans-serif;font-weight:400}
.s700{font-family:fhsans,ui-sans-serif,system-ui,sans-serif;font-weight:700}
</style>
<defs><linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fefefe"/><stop offset="1" stop-color="#fefefe"/></linearGradient><radialGradient id="glow" cx="50%" cy="0%" r="70%"><stop offset="0" stop-color="#006dfe" stop-opacity="0.07"/><stop offset="1" stop-color="#006dfe" stop-opacity="0"/></radialGradient><radialGradient id="markglow"><stop offset="0" stop-color="#006dfe" stop-opacity="0.45"/><stop offset="1" stop-color="#006dfe" stop-opacity="0"/></radialGradient><filter id="markshadow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="0" stdDeviation="9" flood-color="#006dfe" flood-opacity="0.6"/></filter><filter id="lift" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#061121" flood-opacity="0.08"/></filter></defs>
<rect x="0.5" y="0.5" width="759" height="603" rx="20" fill="#f3f6fa" stroke="#dce3ec"/><rect x="1" y="1" width="758" height="260" rx="20" fill="url(#glow)"/>
<rect x="40.5" y="32.5" width="180.8" height="27" rx="14" fill="none" stroke="#c5cfdb" stroke-width="1"/>
<circle cx="55.5" cy="46" r="3.5" fill="#0057cc"/>
<text x="67" y="50.9" class="m500" font-size="14" fill="#3b4a5e">where a run stops</text>
<text x="40" y="102" class="s700" font-size="26" fill="#061121" letter-spacing="-0.5">The agent runs the chain. These stay yours.</text>
<rect x="40.5" y="126.5" width="679" height="137" rx="16" fill="url(#card)" stroke="#0057cc" stroke-width="1" filter="url(#lift)"/>
<text x="64" y="164" class="s700" font-size="19" fill="#061121">Attended, with a configured remote</text>
<text x="64" y="196" class="m500" font-size="14" fill="#0057cc">runs to</text>
<text x="170" y="196" class="s400" font-size="16" fill="#3b4a5e">a pushed task branch and a draft PR</text>
<text x="64" y="222" class="m500" font-size="14" fill="#0057cc">records</text>
<text x="170" y="222" class="s400" font-size="16" fill="#3b4a5e">open decisions and unrun checks, in the PR for you</text>
<text x="64" y="248" class="m500" font-size="14" fill="#15744a">yours</text>
<text x="170" y="248" class="s400" font-size="16" fill="#061121">mark it ready for review, then merge</text>
<rect x="40.5" y="278.5" width="679" height="137" rx="16" fill="url(#card)" stroke="#c5cfdb" stroke-width="1" filter="url(#lift)"/>
<text x="64" y="316" class="s700" font-size="19" fill="#061121">Attended, no remote</text>
<text x="64" y="348" class="m500" font-size="14" fill="#0057cc">runs to</text>
<text x="170" y="348" class="s400" font-size="16" fill="#3b4a5e">the local commit</text>
<text x="64" y="374" class="m500" font-size="14" fill="#0057cc">waits on</text>
<text x="170" y="374" class="s400" font-size="16" fill="#3b4a5e">an open decision, a check it cannot run on itself</text>
<text x="64" y="400" class="m500" font-size="14" fill="#15744a">yours</text>
<text x="170" y="400" class="s400" font-size="16" fill="#061121">every answer it waits for, and the merge</text>
<rect x="40.5" y="430.5" width="679" height="137" rx="16" fill="url(#card)" stroke="#c5cfdb" stroke-width="1" filter="url(#lift)"/>
<text x="64" y="468" class="s700" font-size="19" fill="#061121">Operating mode: assisted</text>
<text x="64" y="500" class="m500" font-size="14" fill="#0057cc">runs to</text>
<text x="170" y="500" class="s400" font-size="16" fill="#3b4a5e">the local commit, with no task branch</text>
<text x="64" y="526" class="m500" font-size="14" fill="#0057cc">waits on</text>
<text x="170" y="526" class="s400" font-size="16" fill="#3b4a5e">open decisions, checks it cannot run on itself</text>
<text x="64" y="552" class="m500" font-size="14" fill="#15744a">yours</text>
<text x="170" y="552" class="s400" font-size="16" fill="#061121">the push, the draft PR, and the merge</text>
</svg>
